<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Titanic Survival Predictor</title>
  <style>
    body { font-family: sans-serif; max-width: 480px; margin: 60px auto; padding: 0 16px; }
    h1   { font-size: 1.4rem; margin-bottom: 24px; }
    label { display: block; margin-top: 14px; font-weight: bold; }
    select, input { width: 100%; padding: 6px 8px; margin-top: 4px; box-sizing: border-box; }
    button { margin-top: 24px; padding: 10px 24px; font-size: 1rem; cursor: pointer; }
    #result { margin-top: 24px; font-size: 1.2rem; font-weight: bold; }
    .survived     { color: green; }
    .not-survived { color: red; }
  </style>
</head>
<body>
  <h1>Titanic Survival Predictor</h1>

  <label>Passenger Class (Pclass)
    <select id="Pclass">
      <option value="1">1 — First</option>
      <option value="2">2 — Second</option>
      <option value="3" selected>3 — Third</option>
    </select>
  </label>

  <label>Sex
    <select id="Sex">
      <option value="0" selected>Male</option>
      <option value="1">Female</option>
    </select>
  </label>

  <label>Age
    <input type="number" id="Age" value="28" min="0" max="100" />
  </label>

  <label>Siblings / Spouses aboard (SibSp)
    <input type="number" id="SibSp" value="0" min="0" />
  </label>

  <label>Parents / Children aboard (Parch)
    <input type="number" id="Parch" value="0" min="0" />
  </label>

  <label>Fare (£)
    <input type="number" id="Fare" value="32" min="0" step="0.01" />
  </label>

  <label>Port of Embarkation
    <select id="Embarked">
      <option value="0">C — Cherbourg</option>
      <option value="1">Q — Queenstown</option>
      <option value="2" selected>S — Southampton</option>
    </select>
  </label>

  <button onclick="predict()">Predict</button>

  <div id="result"></div>

  <script>
    async function predict() {
      const payload = {
        Pclass:   parseInt(document.getElementById('Pclass').value),
        Sex:      parseInt(document.getElementById('Sex').value),
        Age:      parseFloat(document.getElementById('Age').value),
        SibSp:    parseInt(document.getElementById('SibSp').value),
        Parch:    parseInt(document.getElementById('Parch').value),
        Fare:     parseFloat(document.getElementById('Fare').value),
        Embarked: parseInt(document.getElementById('Embarked').value),
      };

      const res = await fetch('/predict', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });

      const data = await res.json();
      const div = document.getElementById('result');

      if (data.survived) {
        div.textContent = '✓ Survived';
        div.className = 'survived';
      } else {
        div.textContent = '✗ Did Not Survive';
        div.className = 'not-survived';
      }
    }
  </script>
</body>
</html>
